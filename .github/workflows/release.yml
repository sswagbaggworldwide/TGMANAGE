name: Build and release Windows installer
on:
  push:
    branches: [main]
    paths: ['version.json']
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          architecture: x64
      - name: Install build dependencies
        run: python -m pip install -r requirements.txt -r converter_requirements.txt -r requirements-build.txt
      - name: Verify version tag
        shell: pwsh
        run: |
          $version = (Get-Content version.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag differs from version.json' }
      - name: Offline tests
        env:
          OPENTELE_NO_FETCH: '1'
        run: python -m unittest discover -s tests -q
      - name: Build setup.exe
        shell: pwsh
        env:
          OPENTELE_NO_FETCH: '1'
        run: |
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $compiler)) { choco install innosetup --yes --no-progress }
          python packaging/build_release.py --iscc $compiler
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: TelegramManager-Windows
          path: |
            release/setup.exe
            release/setup.exe.sha256
            release/TelegramManager-source.zip
      - name: Publish release
        if: github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content version.json -Raw | ConvertFrom-Json).version
          $tag = "v$version"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) { Write-Output 'This version is already published'; exit 0 }
          gh release create $tag release/setup.exe release/setup.exe.sha256 --target $env:GITHUB_SHA --title "Telegram Manager $tag" --generate-notes
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
